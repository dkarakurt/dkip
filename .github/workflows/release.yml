name: Windows sürümü derle

# "v1.0.2" gibi bir etiket gönderildiğinde Windows paketini derler ve Releases'e ekler.
# Actions sekmesinden "Run workflow" ile elle de çalıştırılabilir (sadece derler, indirilebilir dosya bırakır).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Etiketten sürüm numarasını ayarla
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Paketle
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx electron-packager . DKIP --platform=win32 --arch=x64 --out=dist --overwrite --asar \
            --icon=assets/icon.ico --app-version=$VERSION \
            --ignore='^/dist' --ignore='^/docs' --ignore='^/\.github' \
            --win32metadata.CompanyName=DKIP --win32metadata.ProductName=DKIP \
            --win32metadata.FileDescription="DKIP IPTV Oynatici"
          cp BENIOKU.txt dist/DKIP-win32-x64/
          mv dist/DKIP-win32-x64 dist/DKIP

      - name: Zip oluştur
        shell: pwsh
        run: Compress-Archive -Path dist/DKIP -DestinationPath DKIP-Windows.zip

      - name: Derleme çıktısını sakla
        uses: actions/upload-artifact@v4
        with:
          name: DKIP-Windows
          path: DKIP-Windows.zip

      - name: Release oluştur
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DKIP ${{ github.ref_name }}
          files: DKIP-Windows.zip
          body: |
            **Windows için DKIP IPTV oynatıcı**

            1. `DKIP-Windows.zip` dosyasını indirip bir klasöre çıkarın.
            2. `DKIP\DKIP.exe` dosyasını çalıştırın (kurulum gerekmez).
            3. Windows "Bilinmeyen yayımcı" uyarısı verirse **Ek bilgi → Yine de çalıştır** deyin.
